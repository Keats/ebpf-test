name: eBPF File I/O Tracing
on: [push, pull_request]

jobs:
  trace-file-operations:
    runs-on: ubuntu-latest  # Works on hosted runners!
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install eBPF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bpftrace linux-headers-$(uname -r)

      - name: Trace file opens and writes
        run: |
          echo "=== Testing R process name ==="
          
          # Capture all processes during R execution
          cat > debug_process.bt << 'EOF'
          tracepoint:syscalls:sys_enter_openat /strcontains(str(args->filename), "hello.txt") || comm == "Rscript" || comm == "R"/ {
              printf("PROCESS: %s opened: %s\n", comm, str(args->filename));
          }
          EOF
          
          sudo bpftrace debug_process.bt > debug_output.txt 2>&1 &
          DEBUG_PID=$!
          
          sleep 1
          echo "Running R script..."
          Rscript test.R
          sleep 1
          
          sudo kill -KILL $DEBUG_PID 2>/dev/null || true
          
          echo "=== DEBUG RESULTS ==="
          cat debug_output.txt

      - name: Show trace results
        run: |
          echo "=== TRACE FILE SIZE ==="
          ls -la all_r_operations.txt || echo "Trace file not found"
          
          echo -e "\n=== TRACE CONTENTS ==="
          cat all_r_operations.txt || echo "Could not read trace file"